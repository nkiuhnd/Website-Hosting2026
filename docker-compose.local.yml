version: '3.8'

services:
  web-hosting-platform:
    image: hanshuai23/web-hosting-platform:latest
    ports:
      - "4000:4000"
    volumes:
      - ./server/.env:/app/server/.env
      - ./server/prisma:/app/server/prisma
      - ./server/uploads:/app/server/uploads
      - ./client/dist:/app/client/dist
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - web-network
  
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web-hosting-platform
    networks:
      - web-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - web-network

networks:
  web-network:
    driver: bridge